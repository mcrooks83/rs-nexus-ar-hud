#
# Core
#
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384


#
# Logging and USB serial console
#
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y

#
# GPIO, button and vibration motor
#
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

#
# I2C OLED display
#
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y
CONFIG_THREAD_NAME=y

#
# Networking
#
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_TCP=y


#
# Wi-Fi
#
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
# CONFIG_WIFI_MGMT_EXT=y

#
# IPv4 and DHCP
#
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y

#
# Sockets
#
CONFIG_NET_SOCKETS=y
#CONFIG_NET_SOCKETS_POSIX_NAMES=y

#
# DNS
#
CONFIG_DNS_RESOLVER=y

#
# Nexus event transport
#
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y

#
# Network resources
#
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
#CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

#
# Application Wi-Fi settings
#
CONFIG_WIFI_MANAGER_SSID="NexusEdge"
CONFIG_WIFI_MANAGER_PSK="replace-with-password"
CONFIG_WIFI_MANAGER_OPEN_NETWORK=n
CONFIG_WIFI_MANAGER_LOG_LEVEL=3